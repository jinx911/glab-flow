name: Verify

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    name: macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck, test and build
        run: pnpm typecheck && pnpm test --run && pnpm build
      - name: Validate macOS shell scripts
        run: bash -n install.sh uninstall.sh scripts/doctor.sh
