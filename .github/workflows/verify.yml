name: Verify

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck, test and build
        run: pnpm typecheck && pnpm test --run && pnpm build
      - name: Validate macOS shell scripts
        if: runner.os == 'macOS'
        run: bash -n install.sh uninstall.sh scripts/doctor.sh
      - name: Validate Windows PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content install.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content scripts/doctor.ps1 -Raw)) | Out-Null
